syntax = "proto3";

package auth.v1;

option go_package = "github.com/can-you-buy-me/pkg/gen/auth/v1";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}

message RegisterRequest {
  string email = 1;
  string name = 2;
  string password = 3;
}

message RegisterResponse {
  int32 user_id = 1;
  string email = 2;
  string message = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string jwt_token = 1;
  int32 user_id = 2;
  string email = 3;
}

syntax = "proto3";

package auth.v1;

option go_package = "github.com/can-you-buy-me/pkg/gen/auth/v1";

// AuthService: autenticación exclusivamente vía proveedores OAuth/OIDC.
// No hay registro ni login con contraseña: el cliente obtiene un id_token
// del proveedor (Google, Apple, ...) y lo intercambia aquí por un JWT propio.
service AuthService {
  rpc LoginWithProvider(LoginWithProviderRequest) returns (LoginResponse);
}

message LoginWithProviderRequest {
  string provider = 1;  // "google" | "apple"
  string id_token = 2;  // OIDC ID token emitido por el proveedor
}

message LoginResponse {
  string jwt_token = 1;
  int32 user_id = 2;
  string email = 3;
  bool is_new_user = 4;  // true si se creó un usuario nuevo en este login
}

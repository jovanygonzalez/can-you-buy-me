# =====================================================
# NATS Server - Can You Buy Me (desarrollo)
# Motor de pujas en tiempo real + libro de auditoría
# =====================================================

server_name: auction-nats

# Puerto de clientes NATS (TCP). Lo usa el backend Go.
port: 4222

# Puerto de monitoreo HTTP (/healthz, /varz, etc.)
http_port: 8222

# -----------------------------------------------------
# JetStream: persistencia en disco para el stream de pujas
# (libro de auditoría inmutable) y memoria para el bucket KV.
# -----------------------------------------------------
jetstream {
  store_dir: "/data"
  max_file_store: 2GB
  max_memory_store: 256MB
}

# -----------------------------------------------------
# WebSocket: OBLIGATORIO para Flutter Web.
# Los navegadores no hacen TCP crudo, así que el cliente
# Dart de NATS se conecta por aquí (ws://host:8443).
#
# DESARROLLO: no_tls. En PRODUCCIÓN hay que activar TLS y
# autenticación con permisos de subject (los clientes solo
# deben poder SUSCRIBIRSE a auction.*.bids, nunca PUBLICAR).
# -----------------------------------------------------
websocket {
  port: 8443
  no_tls: true
}

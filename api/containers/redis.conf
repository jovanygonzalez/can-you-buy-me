# redis.conf — Redis como CACHÉ DE LECTURA del catálogo de subastas.
#
# Sirve la info estática del producto en subasta (título, precio base,
# URL de la imagen en S3, etc.) para evitar saturar PostgreSQL durante
# las ráfagas de tráfico del "drop" (problema del Thundering Herd).
#
# Patrón idéntico al de NATS: este archivo se monta en el contenedor y
# se pasa a redis-server vía el "command" del docker-compose.

# ---------------------------------------------------------------------------
# Red
# ---------------------------------------------------------------------------
# Escucha en todas las interfaces DENTRO del contenedor (la red de Docker
# ya aísla el servicio). protected-mode no porque no exponemos a internet.
bind 0.0.0.0
protected-mode no
port 6379

# ---------------------------------------------------------------------------
# Memoria y política de expulsión  (LO CRÍTICO para un caché)
# ---------------------------------------------------------------------------
# Limita la RAM del caché. Al llenarse, en vez de fallar, expulsa las claves
# menos usadas recientemente (LRU). Ajusta maxmemory al tamaño del catálogo.
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---------------------------------------------------------------------------
# Persistencia
# ---------------------------------------------------------------------------
# El catálogo se carga de forma manual (scripts / SQL), así que la fuente de
# verdad es PostgreSQL, no Redis. Mantenemos AOF para sobrevivir reinicios
# sin tener que re-sembrar el catálogo a mano.
# Si prefieres un caché 100% volátil, cambia a "appendonly no" y borra los save.
appendonly yes
appendfsync everysec
dir /data

# Snapshots RDB de respaldo (segundos / nº de cambios)
save 900 1
save 300 10
save 60 10000

# ---------------------------------------------------------------------------
# Logs
# ---------------------------------------------------------------------------
loglevel notice
